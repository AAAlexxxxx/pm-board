# Backend of the cloud dashboard (cloud/DESIGN.md): pulls Polymarket, updates the paper books, publishes the site.
name: pmcloud

on:
  schedule:
    - cron: "7,37 * * * *"    # every 30 min: marks, settlement, screener, alerts (GitHub may delay or drop slots)
    - cron: "5 10 * * *"      # daily 10:05 UTC: Claude's engine cycle (trades book B)
  workflow_dispatch:
    inputs:
      mode:
        description: "refresh | cycle | scan"
        default: refresh
        type: choice
        options: [refresh, cycle, scan]
  repository_dispatch:
    types: [refresh, cycle, scan, trade]
  push:
    branches: [main, master]
    paths: ["cloud/backend/**", "cloud/site/**", ".github/workflows/pmcloud.yml"]

concurrency:
  group: pmcloud
  cancel-in-progress: false

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: cloud/backend/requirements.txt
      - run: pip install -r cloud/backend/requirements.txt

      - name: Run pmcloud
        working-directory: cloud/backend
        env:
          PYTHONIOENCODING: utf-8
          DISPATCH_TYPE: ${{ github.event.action }}
          PAYLOAD: ${{ toJSON(github.event.client_payload) }}
        run: |
          case "${{ github.event_name }}" in
            schedule)
              if [ "${{ github.event.schedule }}" = "5 10 * * *" ]; then python -m pmcloud cycle; else python -m pmcloud refresh; fi ;;
            workflow_dispatch) python -m pmcloud "${{ github.event.inputs.mode }}" ;;
            repository_dispatch) python -m pmcloud dispatch ;;
            *) python -m pmcloud refresh ;;
          esac

      - name: Commit state
        run: |
          git config user.name "pmcloud[bot]"
          git config user.email "pmcloud@users.noreply.github.com"
          git add cloud/state
          if git diff --cached --quiet; then
            echo "no state changes"
          else
            git commit -m "state: ${{ github.event_name }} $(date -u +%Y-%m-%dT%H:%MZ)"
            for i in 1 2 3; do git pull --rebase && git push && break || sleep 5; done
          fi

      # Pages must be switched on once in Settings -> Pages -> Source: GitHub Actions. Until then the deploy steps
      # are skipped and the data steps above still keep the books up to date (the run stays green).
      - id: pages
        uses: actions/configure-pages@v5
        continue-on-error: true
      - if: steps.pages.outcome == 'success'
        uses: actions/upload-pages-artifact@v3
        with:
          path: cloud/site
      - id: deploy
        if: steps.pages.outcome == 'success'
        uses: actions/deploy-pages@v4
      - if: steps.pages.outcome != 'success'
        run: |
          echo "::warning::GitHub Pages is not enabled yet. Settings -> Pages -> Source 'GitHub Actions', then re-run."
